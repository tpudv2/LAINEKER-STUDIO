<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" shape-rendering="crispEdges" width="640" height="400">
  <!-- background -->
  <rect width="160" height="100" fill="#d6eaf8"/>

  <!-- snow ground -->
  <rect x="0" y="82" width="160" height="18" fill="#eaf4fb"/>
  <rect x="0" y="80" width="160" height="2" fill="#c8dff0"/>

  <!-- snow hills -->
  <rect x="10" y="78" width="40" height="4" fill="#eaf4fb"/>
  <rect x="14" y="76" width="32" height="2" fill="#eaf4fb"/>
  <rect x="18" y="74" width="24" height="2" fill="#eaf4fb"/>

  <rect x="110" y="78" width="44" height="4" fill="#eaf4fb"/>
  <rect x="114" y="76" width="36" height="2" fill="#eaf4fb"/>
  <rect x="118" y="74" width="28" height="2" fill="#eaf4fb"/>

  <!-- snowflakes -->
  <rect x="20" y="10" width="2" height="2" fill="white" opacity=".7"/>
  <rect x="60" y="6"  width="2" height="2" fill="white" opacity=".6"/>
  <rect x="100" y="14" width="2" height="2" fill="white" opacity=".7"/>
  <rect x="140" y="8"  width="2" height="2" fill="white" opacity=".6"/>
  <rect x="80" y="20"  width="2" height="2" fill="white" opacity=".5"/>

  <!-- ===== PENGUIN LEFT ===== -->
  <!-- body -->
  <rect x="42" y="52" width="22" height="28" fill="#1a1a2e"/>
  <!-- belly -->
  <rect x="46" y="56" width="14" height="20" fill="#f5f5f0"/>
  <!-- head -->
  <rect x="44" y="40" width="18" height="14" fill="#1a1a2e"/>
  <!-- cheeks blush -->
  <rect x="44" y="48" width="4" height="3" fill="#f48fb1" opacity=".8"/>
  <rect x="58" y="48" width="4" height="3" fill="#f48fb1" opacity=".8"/>
  <!-- eyes -->
  <rect x="47" y="43" width="3" height="3" fill="white"/>
  <rect x="56" y="43" width="3" height="3" fill="white"/>
  <rect x="48" y="44" width="2" height="2" fill="#111"/>
  <rect x="57" y="44" width="2" height="2" fill="#111"/>
  <!-- eye shine -->
  <rect x="49" y="44" width="1" height="1" fill="white"/>
  <rect x="58" y="44" width="1" height="1" fill="white"/>
  <!-- beak -->
  <rect x="50" y="50" width="6" height="3" fill="#f5a623"/>
  <rect x="51" y="51" width="4" height="1" fill="#e08800"/>
  <!-- smile -->
  <rect x="49" y="52" width="2" height="1" fill="#f5a623"/>
  <rect x="55" y="52" width="2" height="1" fill="#f5a623"/>
  <!-- wings -->
  <rect x="34" y="54" width="8" height="16" fill="#1a1a2e"/>
  <rect x="64" y="52" width="8" height="16" fill="#1a1a2e"/>
  <!-- left wing raised (happy) -->
  <rect x="36" y="48" width="6" height="8" fill="#1a1a2e"/>
  <rect x="34" y="44" width="4" height="6" fill="#1a1a2e"/>
  <!-- feet -->
  <rect x="44" y="78" width="8" height="4" fill="#f5a623"/>
  <rect x="54" y="78" width="8" height="4" fill="#f5a623"/>
  <rect x="42" y="80" width="4" height="2" fill="#f5a623"/>
  <rect x="60" y="80" width="4" height="2" fill="#f5a623"/>

  <!-- ===== PENGUIN RIGHT ===== -->
  <!-- body -->
  <rect x="96" y="52" width="22" height="28" fill="#1a1a2e"/>
  <!-- belly -->
  <rect x="100" y="56" width="14" height="20" fill="#f5f5f0"/>
  <!-- head -->
  <rect x="98" y="40" width="18" height="14" fill="#1a1a2e"/>
  <!-- cheeks blush -->
  <rect x="98" y="48" width="4" height="3" fill="#f48fb1" opacity=".8"/>
  <rect x="112" y="48" width="4" height="3" fill="#f48fb1" opacity=".8"/>
  <!-- eyes -->
  <rect x="101" y="43" width="3" height="3" fill="white"/>
  <rect x="110" y="43" width="3" height="3" fill="white"/>
  <rect x="102" y="44" width="2" height="2" fill="#111"/>
  <rect x="111" y="44" width="2" height="2" fill="#111"/>
  <!-- eye shine -->
  <rect x="103" y="44" width="1" height="1" fill="white"/>
  <rect x="112" y="44" width="1" height="1" fill="white"/>
  <!-- beak -->
  <rect x="104" y="50" width="6" height="3" fill="#f5a623"/>
  <rect x="105" y="51" width="4" height="1" fill="#e08800"/>
  <!-- smile -->
  <rect x="103" y="52" width="2" height="1" fill="#f5a623"/>
  <rect x="109" y="52" width="2" height="1" fill="#f5a623"/>
  <!-- wings -->
  <rect x="88" y="52" width="8" height="16" fill="#1a1a2e"/>
  <rect x="118" y="54" width="8" height="16" fill="#1a1a2e"/>
  <!-- right wing raised (happy) -->
  <rect x="120" y="48" width="6" height="8" fill="#1a1a2e"/>
  <rect x="122" y="44" width="4" height="6" fill="#1a1a2e"/>
  <!-- feet -->
  <rect x="98" y="78" width="8" height="4" fill="#f5a623"/>
  <rect x="108" y="78" width="8" height="4" fill="#f5a623"/>
  <rect x="96" y="80" width="4" height="2" fill="#f5a623"/>
  <rect x="114" y="80" width="4" height="2" fill="#f5a623"/>

  <!-- heart between them -->
  <rect x="76" y="36" width="4" height="2" fill="#e74c3c"/>
  <rect x="82" y="36" width="4" height="2" fill="#e74c3c"/>
  <rect x="74" y="38" width="14" height="4" fill="#e74c3c"/>
  <rect x="76" y="42" width="10" height="2" fill="#e74c3c"/>
  <rect x="78" y="44" width="6" height="2" fill="#e74c3c"/>
  <rect x="80" y="46" width="2" height="2" fill="#e74c3c"/>
</svg>
