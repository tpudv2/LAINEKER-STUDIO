<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- bg dark tech -->
  <rect width="64" height="64" fill="#1a1a2e"/>
  <!-- grid lines -->
  <rect x="0" y="8"  width="64" height="1" fill="#2a2a4e" opacity=".6"/>
  <rect x="0" y="16" width="64" height="1" fill="#2a2a4e" opacity=".6"/>
  <rect x="0" y="24" width="64" height="1" fill="#2a2a4e" opacity=".6"/>
  <rect x="0" y="32" width="64" height="1" fill="#2a2a4e" opacity=".6"/>
  <rect x="0" y="40" width="64" height="1" fill="#2a2a4e" opacity=".6"/>
  <rect x="0" y="48" width="64" height="1" fill="#2a2a4e" opacity=".6"/>
  <rect x="8"  y="0" width="1" height="64" fill="#2a2a4e" opacity=".6"/>
  <rect x="16" y="0" width="1" height="64" fill="#2a2a4e" opacity=".6"/>
  <rect x="24" y="0" width="1" height="64" fill="#2a2a4e" opacity=".6"/>
  <rect x="32" y="0" width="1" height="64" fill="#2a2a4e" opacity=".6"/>
  <rect x="40" y="0" width="1" height="64" fill="#2a2a4e" opacity=".6"/>
  <rect x="48" y="0" width="1" height="64" fill="#2a2a4e" opacity=".6"/>
  <rect x="56" y="0" width="1" height="64" fill="#2a2a4e" opacity=".6"/>
  <!-- ground -->
  <rect x="0" y="54" width="64" height="10" fill="#0d0d1f"/>
  <!-- body - light penguin for contrast -->
  <rect x="20" y="30" width="24" height="24" fill="#2c3e6e"/>
  <!-- belly -->
  <rect x="24" y="34" width="16" height="16" fill="#ecf0f1"/>
  <!-- head -->
  <rect x="22" y="18" width="20" height="14" fill="#2c3e6e"/>
  <!-- VR headset -->
  <rect x="20" y="20" width="24" height="8" fill="#16213e"/>
  <rect x="22" y="22" width="8"  height="4" fill="#00d4ff" opacity=".8"/>
  <rect x="34" y="22" width="8"  height="4" fill="#00d4ff" opacity=".8"/>
  <rect x="30" y="23" width="4"  height="2" fill="#0a3d62"/>
  <!-- glow from headset -->
  <rect x="22" y="22" width="8" height="4" fill="#00d4ff" opacity=".3"/>
  <rect x="34" y="22" width="8" height="4" fill="#00d4ff" opacity=".3"/>
  <!-- beak -->
  <rect x="29" y="30" width="6" height="3" fill="#f5a623"/>
  <!-- smirk -->
  <rect x="31" y="32" width="4" height="1" fill="#e08800"/>
  <!-- wings -->
  <rect x="12" y="32" width="8" height="14" fill="#2c3e6e"/>
  <rect x="44" y="32" width="8" height="14" fill="#2c3e6e"/>
  <!-- 3d cube floating -->
  <rect x="46" y="18" width="12" height="10" fill="#00d4ff" opacity=".6"/>
  <rect x="48" y="16" width="12" height="10" fill="#0099bb" opacity=".6"/>
  <rect x="46" y="18" width="12" height="1"  fill="#00ffff" opacity=".8"/>
  <rect x="46" y="18" width="1"  height="10" fill="#00ffff" opacity=".8"/>
  <!-- feet -->
  <rect x="24" y="52" width="8" height="4" fill="#f5a623"/>
  <rect x="34" y="52" width="8" height="4" fill="#f5a623"/>
</svg>
