<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- bg warm -->
  <rect width="64" height="64" fill="#fce8e8"/>
  <!-- snow -->
  <rect x="0" y="54" width="64" height="10" fill="#fff0f0"/>
  <rect x="0" y="52" width="64" height="2" fill="#f0d0d0"/>
  <!-- body -->
  <rect x="20" y="30" width="24" height="24" fill="#1a1a2e"/>
  <!-- belly -->
  <rect x="24" y="34" width="16" height="16" fill="#f5f5f0"/>
  <!-- head -->
  <rect x="22" y="18" width="20" height="14" fill="#1a1a2e"/>
  <!-- flower crown -->
  <rect x="22" y="14" width="20" height="4" fill="#1a1a2e"/>
  <rect x="24" y="10" width="4" height="4" fill="#e74c3c"/>
  <rect x="30" y="8"  width="4" height="4" fill="#f39c12"/>
  <rect x="36" y="10" width="4" height="4" fill="#e74c3c"/>
  <rect x="26" y="8"  width="2" height="2" fill="#f1c40f"/>
  <rect x="32" y="6"  width="2" height="2" fill="#f1c40f"/>
  <rect x="38" y="8"  width="2" height="2" fill="#f1c40f"/>
  <!-- blush -->
  <rect x="22" y="28" width="4" height="3" fill="#f48fb1" opacity=".9"/>
  <rect x="38" y="28" width="4" height="3" fill="#f48fb1" opacity=".9"/>
  <!-- eyes happy curved -->
  <rect x="26" y="24" width="4" height="2" fill="white"/>
  <rect x="34" y="24" width="4" height="2" fill="white"/>
  <rect x="27" y="25" width="2" height="2" fill="#111"/>
  <rect x="35" y="25" width="2" height="2" fill="#111"/>
  <rect x="28" y="25" width="1" height="1" fill="white"/>
  <rect x="36" y="25" width="1" height="1" fill="white"/>
  <!-- beak -->
  <rect x="29" y="30" width="6" height="3" fill="#f5a623"/>
  <!-- big smile -->
  <rect x="27" y="32" width="2" height="2" fill="#e08800"/>
  <rect x="35" y="32" width="2" height="2" fill="#e08800"/>
  <rect x="29" y="33" width="6" height="1" fill="#e08800"/>
  <!-- wings -->
  <rect x="12" y="32" width="8" height="14" fill="#1a1a2e"/>
  <rect x="44" y="32" width="8" height="14" fill="#1a1a2e"/>
  <!-- fabric swatch -->
  <rect x="44" y="30" width="8" height="10" fill="#e74c3c"/>
  <rect x="46" y="30" width="2" height="10" fill="#c0392b"/>
  <rect x="50" y="30" width="2" height="10" fill="#c0392b"/>
  <!-- feet -->
  <rect x="24" y="52" width="8" height="4" fill="#f5a623"/>
  <rect x="34" y="52" width="8" height="4" fill="#f5a623"/>
</svg>
