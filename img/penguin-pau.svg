<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- bg construction yellow -->
  <rect width="64" height="64" fill="#fff8dc"/>
  <!-- snow/ground -->
  <rect x="0" y="54" width="64" height="10" fill="#fffaec"/>
  <rect x="0" y="52" width="64" height="2" fill="#e8d080"/>
  <!-- body -->
  <rect x="20" y="30" width="24" height="24" fill="#1a1a2e"/>
  <!-- belly -->
  <rect x="24" y="34" width="16" height="16" fill="#f5f5f0"/>
  <!-- hard hat -->
  <rect x="18" y="18" width="28" height="4" fill="#f5a623"/>
  <rect x="20" y="12" width="24" height="8" fill="#f5a623"/>
  <rect x="24" y="10" width="16" height="4" fill="#f5a623"/>
  <!-- head under hat -->
  <rect x="22" y="20" width="20" height="12" fill="#1a1a2e"/>
  <!-- eyes serious -->
  <rect x="26" y="24" width="3" height="3" fill="white"/>
  <rect x="35" y="24" width="3" height="3" fill="white"/>
  <rect x="27" y="25" width="2" height="2" fill="#111"/>
  <rect x="36" y="25" width="2" height="2" fill="#111"/>
  <rect x="28" y="25" width="1" height="1" fill="white"/>
  <rect x="37" y="25" width="1" height="1" fill="white"/>
  <!-- eyebrow serious -->
  <rect x="26" y="23" width="4" height="1" fill="#1a1a2e"/>
  <rect x="34" y="23" width="4" height="1" fill="#1a1a2e"/>
  <!-- beak -->
  <rect x="29" y="30" width="6" height="3" fill="#f5a623"/>
  <!-- neutral mouth -->
  <rect x="29" y="33" width="6" height="1" fill="#e08800"/>
  <!-- wings -->
  <rect x="12" y="32" width="8" height="14" fill="#1a1a2e"/>
  <rect x="44" y="32" width="8" height="14" fill="#1a1a2e"/>
  <!-- clipboard -->
  <rect x="44" y="28" width="10" height="14" fill="#f5f5dc"/>
  <rect x="44" y="28" width="10" height="2"  fill="#c8a050"/>
  <rect x="46" y="32" width="6" height="1" fill="#999"/>
  <rect x="46" y="34" width="6" height="1" fill="#999"/>
  <rect x="46" y="36" width="4" height="1" fill="#999"/>
  <!-- feet -->
  <rect x="24" y="52" width="8" height="4" fill="#f5a623"/>
  <rect x="34" y="52" width="8" height="4" fill="#f5a623"/>
</svg>
