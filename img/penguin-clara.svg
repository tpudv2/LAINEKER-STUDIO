<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- bg mint -->
  <rect width="64" height="64" fill="#e0f5ee"/>
  <!-- ground -->
  <rect x="0" y="54" width="64" height="10" fill="#f0fbf6"/>
  <rect x="0" y="52" width="64" height="2" fill="#b0ddc8"/>
  <!-- body -->
  <rect x="20" y="30" width="24" height="24" fill="#1a1a2e"/>
  <!-- belly -->
  <rect x="24" y="34" width="16" height="16" fill="#f5f5f0"/>
  <!-- head -->
  <rect x="22" y="18" width="20" height="14" fill="#1a1a2e"/>
  <!-- cute bun hairstyle -->
  <rect x="22" y="14" width="20" height="6" fill="#3d2b1f"/>
  <rect x="24" y="10" width="16" height="6" fill="#3d2b1f"/>
  <rect x="28" y="8"  width="8"  height="4" fill="#3d2b1f"/>
  <rect x="30" y="6"  width="4"  height="4" fill="#5c3d2e"/>
  <!-- hair pins -->
  <rect x="22" y="14" width="2" height="2" fill="#e74c3c"/>
  <rect x="40" y="14" width="2" height="2" fill="#e74c3c"/>
  <!-- blush -->
  <rect x="22" y="27" width="4" height="3" fill="#f48fb1" opacity=".8"/>
  <rect x="38" y="27" width="4" height="3" fill="#f48fb1" opacity=".8"/>
  <!-- eyes sparkle -->
  <rect x="26" y="23" width="4" height="4" fill="white"/>
  <rect x="34" y="23" width="4" height="4" fill="white"/>
  <rect x="27" y="24" width="2" height="3" fill="#111"/>
  <rect x="35" y="24" width="2" height="3" fill="#111"/>
  <rect x="28" y="24" width="1" height="1" fill="white"/>
  <rect x="36" y="24" width="1" height="1" fill="white"/>
  <!-- eyelashes -->
  <rect x="26" y="22" width="1" height="2" fill="#111"/>
  <rect x="28" y="21" width="1" height="2" fill="#111"/>
  <rect x="30" y="22" width="1" height="2" fill="#111"/>
  <rect x="34" y="22" width="1" height="2" fill="#111"/>
  <rect x="36" y="21" width="1" height="2" fill="#111"/>
  <rect x="38" y="22" width="1" height="2" fill="#111"/>
  <!-- beak -->
  <rect x="29" y="30" width="6" height="3" fill="#f5a623"/>
  <!-- smile -->
  <rect x="28" y="32" width="2" height="2" fill="#e08800"/>
  <rect x="34" y="32" width="2" height="2" fill="#e08800"/>
  <rect x="30" y="33" width="4" height="1" fill="#e08800"/>
  <!-- wings -->
  <rect x="12" y="32" width="8" height="14" fill="#1a1a2e"/>
  <rect x="44" y="32" width="8" height="14" fill="#1a1a2e"/>
  <!-- tiny chair/furniture piece -->
  <rect x="6" y="40" width="10" height="8" fill="#8b6914"/>
  <rect x="4"  y="46" width="2" height="6" fill="#6b4f10"/>
  <rect x="14" y="46" width="2" height="6" fill="#6b4f10"/>
  <rect x="6"  y="38" width="10" height="4" fill="#a0522d"/>
  <!-- feet -->
  <rect x="24" y="52" width="8" height="4" fill="#f5a623"/>
  <rect x="34" y="52" width="8" height="4" fill="#f5a623"/>
</svg>
