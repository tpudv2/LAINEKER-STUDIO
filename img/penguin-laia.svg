<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- bg -->
  <rect width="64" height="64" fill="#dce8f5"/>
  <!-- snow -->
  <rect x="0" y="54" width="64" height="10" fill="#eaf4fb"/>
  <rect x="0" y="52" width="64" height="2" fill="#c8dff0"/>
  <!-- body -->
  <rect x="20" y="30" width="24" height="24" fill="#1a1a2e"/>
  <!-- belly -->
  <rect x="24" y="34" width="16" height="16" fill="#f5f5f0"/>
  <!-- head -->
  <rect x="22" y="18" width="20" height="14" fill="#1a1a2e"/>
  <!-- architect beret (dark red) -->
  <rect x="20" y="14" width="24" height="4" fill="#8b1a1a"/>
  <rect x="22" y="10" width="20" height="6" fill="#8b1a1a"/>
  <rect x="28" y="8"  width="8"  height="4" fill="#8b1a1a"/>
  <rect x="30" y="6"  width="4"  height="4" fill="#c0392b"/>
  <!-- glasses -->
  <rect x="24" y="24" width="6" height="5" fill="none" stroke="#c0a060" stroke-width="1"/>
  <rect x="34" y="24" width="6" height="5" fill="none" stroke="#c0a060" stroke-width="1"/>
  <rect x="30" y="26" width="4" height="1" fill="#c0a060"/>
  <!-- eyes -->
  <rect x="26" y="25" width="2" height="2" fill="#111"/>
  <rect x="36" y="25" width="2" height="2" fill="#111"/>
  <rect x="27" y="25" width="1" height="1" fill="white"/>
  <rect x="37" y="25" width="1" height="1" fill="white"/>
  <!-- beak -->
  <rect x="29" y="30" width="6" height="3" fill="#f5a623"/>
  <!-- smile -->
  <rect x="28" y="32" width="2" height="1" fill="#e08800"/>
  <rect x="34" y="32" width="2" height="1" fill="#e08800"/>
  <!-- wings -->
  <rect x="12" y="32" width="8" height="14" fill="#1a1a2e"/>
  <rect x="44" y="32" width="8" height="14" fill="#1a1a2e"/>
  <!-- blueprint roll in wing -->
  <rect x="6"  y="34" width="8" height="6" fill="#e8f4f8"/>
  <rect x="6"  y="34" width="8" height="1" fill="#bcd4e6"/>
  <rect x="8"  y="36" width="4" height="1" fill="#5b9bd5"/>
  <rect x="8"  y="38" width="6" height="1" fill="#5b9bd5"/>
  <!-- feet -->
  <rect x="24" y="52" width="8" height="4" fill="#f5a623"/>
  <rect x="34" y="52" width="8" height="4" fill="#f5a623"/>
</svg>
